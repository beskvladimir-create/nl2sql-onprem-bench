[project]
name = "nl2sql-onprem-bench"
version = "0.3.0"
description = "Benchmark harness, predictions and analysis for self-hosted open-weight LLMs on Text-to-SQL (BIRD dev)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",        # OpenAI-compatible client for vLLM endpoint
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "func-timeout>=4.3",   # bound per-query SQLite execution
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# retrieval-based schema linker (link_emb stages); heavy, install on the GPU box
emb = ["sentence-transformers>=2.7", "numpy>=1.24"]
# analysis/paper_numbers.py, analysis/make_figures.py (recompute the paper from results/)
analysis = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "matplotlib>=3.8", "pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql_bench"]
